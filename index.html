<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atividade 5 - Card de Notícia</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-sm mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden">

        <!-- Imagem -->
        <img
        src="img/Jogos_Intercampi_Estudantis_2024_-.2e16d0ba.fill-540x540.png"
        alt="Jogos Intercampi Estudantis 2026"
        class="w-full h-auto object-cover"
    >

        <!-- Conteúdo -->
        <div class="p-6 space-y-3">

            <h2 class="text-2xl font-bold text-green-800">
                Jogos Intercampi Estudantis 2026
            </h2>

            <p class="text-gray-700 text-base">
                O IFRN promove os Jogos Intercampi Estudantis 2026,
                reunindo estudantes dos diferentes campi em atividades
                esportivas e de integração.
            </p>

            <!-- Badges -->
            <div class="flex flex-wrap gap-2">

                <span class="bg-green-200 text-green-800
                             text-xs font-semibold px-3 py-1 rounded-full">
                    IFRN
                </span>

                <span class="bg-green-100 text-green-800
                             text-xs font-semibold px-3 py-1 rounded-full">
                    Jogos Intercampi
                </span>

            </div>

        </div>

    </div>

</body>
</html>
